name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: xcodebuild -project SafariTabsExtension/SafariTabsExtension.xcodeproj -target SafariTabsExtension -configuration Release CODE_SIGNING_ALLOWED=NO build -quiet
      - run: swift build -c release
      - run: python3 -m unittest test_sparkle_support
        working-directory: scripts
      - run: node --test worker.test.mjs
        working-directory: site

  shared_candidate:
    uses: sass-maker/saas-maker/.github/workflows/daddy-macos-candidate.yml@de31581b56fa8b6c20a03d0846ad2204aa2c9bab
    with:
      app: browserdaddy
      tooling-ref: de31581b56fa8b6c20a03d0846ad2204aa2c9bab
